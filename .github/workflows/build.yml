name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build Shos.Windows.sln --configuration Release
      - run: dotnet test Shos.Windows.sln --configuration Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: Shos.Windows/bin/Release/*.*nupkg
